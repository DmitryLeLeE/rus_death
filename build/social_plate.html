<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plate social card template (1200×630). Filled by build/make_social.mjs.</title>
<style>
  @font-face { font-family: "Anton"; src: url(../assets/fonts/anton-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Anton"; src: url(../assets/fonts/anton-cyr-fira-900.woff2) format("woff2"); font-weight: 400; unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: "Source Serif 4"; src: url(../assets/fonts/sourceserif4-400-italic.woff2) format("woff2"); font-style: italic; }
  @font-face { font-family: "Source Serif 4"; src: url(../assets/fonts/sourceserif4-cyr-400-italic.woff2) format("woff2"); font-style: italic; unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: "IBM Plex Mono"; src: url(../assets/fonts/plexmono-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "IBM Plex Mono"; src: url(../assets/fonts/plexmono-cyr-400-normal.woff2) format("woff2"); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0d0c0b; color: #f3eee2; font-family: "Source Serif 4", Georgia, serif; }
  .ground { position: absolute; inset: 0; background-size: cover; background-position: 50% 40%; filter: grayscale(1) contrast(1.15) brightness(0.5); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,12,11,.94) 0%, rgba(13,12,11,.7) 55%, rgba(13,12,11,.25) 100%); }
  .grain { position: absolute; inset: 0; background: url(../assets/textures/paper-grain.jpg); mix-blend-mode: multiply; opacity: .25; }
  .mono { font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .2em; }
  .kicker { position: absolute; left: 56px; top: 44px; font-size: 15px; color: #d93b27; }
  .letter { position: absolute; right: 54px; top: 14px; font: 400 430px/1 "Anton", Impact, sans-serif; color: #d93b27; opacity: .9; mix-blend-mode: screen; }
  h1 { position: absolute; left: 52px; top: 118px; width: 760px; font: 400 128px/0.9 "Anton", Impact, sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }
  .sub { position: absolute; left: 56px; bottom: 96px; width: 700px; font: italic 400 30px/1.28 "Source Serif 4", serif; color: rgba(243,238,226,.94); }
  .sub::before { content: ""; display: block; width: 76px; height: 4px; background: #d93b27; margin-bottom: 16px; }
  .meta { position: absolute; left: 56px; bottom: 36px; font-size: 13px; color: rgba(243,238,226,.7); }
  .site { position: absolute; right: 56px; bottom: 36px; font-size: 13px; color: rgba(243,238,226,.7); text-align: right; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: #b3241a; }
</style>
</head>
<body>
  <div class="ground" id="ground"></div><div class="shade"></div><div class="grain"></div>
  <p class="kicker mono" id="kicker"></p>
  <p class="letter" id="letter"></p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <p class="meta mono" id="meta"></p>
  <p class="site mono" id="site"></p>
  <div class="bar"></div>
<script>
  window.fill = (d) => {
    document.documentElement.lang = d.lang;
    ground.style.backgroundImage = `url(../assets/derived/${d.image}.webp)`;
    ground.style.backgroundPosition = d.pos || "50% 40%";
    kicker.textContent = d.kicker;
    letter.textContent = d.letter;
    title.textContent = d.title;
    // long titles: step the size down so they stay on at most two lines
    const n = d.title.length;
    title.style.fontSize = n > 22 ? "92px" : n > 14 ? "108px" : "128px";
    sub.textContent = d.subtitle;
    meta.textContent = d.meta;
    site.textContent = d.site;
  };
</script>
</body>
</html>
