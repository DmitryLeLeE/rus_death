<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARCHÆOLOGY OF RUSSIAN DEATH — social card (1200×630). Use ?lang=ru for the Russian card.</title>
<style>
  @font-face { font-family: "Anton"; src: url(../assets/fonts/anton-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Anton"; src: url(../assets/fonts/anton-cyr-fira-900.woff2) format("woff2"); font-weight: 400; unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: "Source Serif 4"; src: url(../assets/fonts/sourceserif4-400-italic.woff2) format("woff2"); font-style: italic; }
  @font-face { font-family: "Source Serif 4"; src: url(../assets/fonts/sourceserif4-cyr-400-italic.woff2) format("woff2"); font-style: italic; unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  @font-face { font-family: "IBM Plex Mono"; src: url(../assets/fonts/plexmono-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "IBM Plex Mono"; src: url(../assets/fonts/plexmono-cyr-400-normal.woff2) format("woff2"); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0d0c0b; color: #f3eee2; font-family: "Source Serif 4", Georgia, serif; }
  .ground { position: absolute; inset: 0; background: url(../assets/derived/hero-tomb.webp) 50% 40% / cover; filter: grayscale(1) contrast(1.15) brightness(0.55); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,12,11,.92) 0%, rgba(13,12,11,.55) 58%, rgba(13,12,11,.2) 100%); }
  .grain { position: absolute; inset: 0; background: url(../assets/textures/paper-grain.jpg); mix-blend-mode: multiply; opacity: .25; }
  .mono { font-family: "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .2em; }
  .kicker { position: absolute; left: 56px; top: 44px; font-size: 15px; color: #d93b27; }
  h1 { position: absolute; left: 50px; top: 82px; font: 400 150px/0.84 "Anton", Impact, sans-serif; text-transform: uppercase; letter-spacing: -0.012em; }
  h1 span { display: block; white-space: nowrap; }
  h1 .r { color: #d93b27; padding-left: 0; }
  h1 .of { font: italic 400 46px "Source Serif 4", serif; text-transform: none; color: #e6e0d0; vertical-align: 0.5em; letter-spacing: 0; padding-right: 8px; }
  .sub { position: absolute; left: 56px; bottom: 56px; width: 560px; font: italic 400 27px/1.28 "Source Serif 4", serif; color: rgba(243,238,226,.92); }
  .sub::before { content: ""; display: block; width: 76px; height: 4px; background: #d93b27; margin-bottom: 16px; }
  .sheet { position: absolute; right: 70px; top: 72px; width: 300px; transform: rotate(2.4deg); filter: drop-shadow(0 16px 24px rgba(0,0,0,.7)); }
  .sheet i { display: block; background: #ebe5d4; padding: 9px; clip-path: polygon(0 3%, 6% 0, 14% 2%, 24% 0, 36% 3%, 48% 0, 60% 2%, 72% 0, 84% 3%, 94% 0, 100% 2%, 99% 20%, 100% 40%, 98% 60%, 100% 80%, 99% 100%, 90% 98%, 78% 100%, 64% 98%, 50% 100%, 36% 98%, 22% 100%, 10% 98%, 0 100%, 1% 80%, 0 60%, 2% 40%, 0 20%); }
  .sheet img { display: block; width: 100%; height: 360px; object-fit: cover; object-position: 50% 30%; filter: grayscale(1) contrast(1.2); }
  .tape { position: absolute; left: 38%; top: -14px; width: 130px; height: 28px; background: rgba(214,205,170,.7); transform: rotate(-8deg); z-index: 2; clip-path: polygon(0 30%, 5% 0, 95% 12%, 100% 70%, 96% 100%, 4% 86%); }
  .sheet2 { position: absolute; right: 250px; bottom: 44px; width: 210px; transform: rotate(-3.5deg); filter: drop-shadow(0 12px 18px rgba(0,0,0,.7)); }
  .sheet2 i { display: block; background: #d9d2bd; padding: 7px; clip-path: polygon(0 4%, 12% 0, 30% 3%, 55% 0, 78% 3%, 100% 0, 98% 30%, 100% 62%, 97% 100%, 70% 97%, 40% 100%, 12% 97%, 0 100%, 2% 60%, 0 30%); }
  .sheet2 img { display: block; width: 100%; height: 130px; object-fit: cover; filter: grayscale(1) contrast(1.25); }
  .stamp { position: absolute; right: 52px; bottom: 56px; border: 3px double #d93b27; color: #d93b27; padding: 9px 14px; transform: rotate(-6deg); font-size: 13px; line-height: 1.5; background: rgba(13,12,11,.6); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: #b3241a; }
</style>
</head>
<body>
  <div class="ground"></div><div class="shade"></div><div class="grain"></div>
  <p class="kicker mono" id="kicker"></p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="sheet"><span class="tape"></span><i><img src="../assets/derived/golubets-roof.webp" alt=""></i></div>
  <div class="sheet2"><i><img src="../assets/derived/perov-sled.webp" alt=""></i></div>
  <p class="stamp mono" id="stamp"></p>
  <div class="bar"></div>
<script>
  const ru = new URLSearchParams(location.search).get("lang") === "ru";
  document.documentElement.lang = ru ? "ru" : "en";
  const T = ru ? {
    kicker: "АТЛАС · ДВЕНАДЦАТЬ ЛИСТОВ · ИЗДАНИЕ 2026",
    title: '<span>Археология</span><span class="r">русской</span><span>смерти</span>',
    sub: "Материальный архив русской смерти, обряда и памяти.",
    stamp: "ЭКЗЕМПЛЯР<br>АРХИВА 12"
  } : {
    kicker: "AN ATLAS · TWELVE PLATES · FIRST EDITION 2026",
    title: '<span>Archæology</span><span><i class="of">of</i><b class="r" style="font-weight:400">Russian</b></span><span>Death</span>',
    sub: "A material archive of Russian death, ritual and memory.",
    stamp: "ARCHIVE<br>COPY 12"
  };
  kicker.textContent = T.kicker; title.innerHTML = T.title; sub.textContent = T.sub; stamp.innerHTML = T.stamp;
  if (ru) title.style.fontSize = "128px";
</script>
</body>
</html>
