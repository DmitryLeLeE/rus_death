<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 872" role="img"><rect width="1000" height="872" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="852" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">WHO LAY WHERE, ON A PLAN OF THE CEMETERY</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Schematic: zones, not distances. Each note is placed by what its source says and carries that source's date and limit.</text><path d="M680 590 L621 705" stroke="#B00000" stroke-width="1.3" fill="none"/><path d="M680 140 L571 430" stroke="#B00000" stroke-width="1.3" fill="none"/><path d="M320 560 L379 705" stroke="#B00000" stroke-width="1.3" fill="none"/><path d="M320 340 L361 392" stroke="#B00000" stroke-width="1.3" fill="none"/><path d="M320 140 L429 340" stroke="#B00000" stroke-width="1.3" fill="none"/><rect x="30" y="100" width="290" height="112" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="50" cy="122" r="11" fill="#B00000"/><text x="50" y="126.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">1</text><text x="66" y="120" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">UNBAPTISED INFANTS, SMOLENSK,</text><text x="66" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">2018–19</text><text x="40" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Buried in the common cemetery; not</text><text x="40" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">called ‘unclean’.</text><text x="40" y="200" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ryko. Informants’ memory; one region.</text><rect x="30" y="300" width="290" height="111" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="50" cy="322" r="11" fill="#B00000"/><text x="50" y="326.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">2</text><text x="66" y="320" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">SORCERERS</text><text x="40" y="346" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Outside the cemetery or by its fence.</text><text x="40" y="361" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Stake and severed head are reported,</text><text x="40" y="376" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">from one modern informant.</text><text x="40" y="399" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ovseichik. Vitebsk, Pskov, Smolensk.</text><rect x="30" y="500" width="290" height="111" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><circle cx="50" cy="522" r="11" fill="#B00000"/><text x="50" y="526.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">5</text><text x="66" y="520" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">UNBAPTISED CHILDREN</text><text x="40" y="546" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Kept out of common cemeteries; the ban</text><text x="40" y="561" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">called strictly enforced. Place not</text><text x="40" y="576" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">given.</text><text x="40" y="599" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ovseichik. First half of the 20th c.</text><rect x="680" y="100" width="290" height="96" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="700" cy="122" r="11" fill="#B00000"/><text x="700" y="126.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">4</text><text x="716" y="120" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">VIOLENT DEATH, MUSCOVITE RUSSIA</text><text x="690" y="146" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">No obstacle to cemetery burial and</text><text x="690" y="161" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">commemoration, on the author’s reading.</text><text x="690" y="184" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Avdeev. Abstract only; article not read.</text><rect x="680" y="300" width="290" height="111" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><circle cx="700" cy="322" r="11" fill="#B00000"/><text x="700" y="326.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">3</text><text x="716" y="320" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">SUICIDES</text><text x="690" y="346" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Crossroads, swamp, ditch by the</text><text x="690" y="361" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">cemetery, hills, forest. No wash, meal</text><text x="690" y="376" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">or service; sometimes an aspen stake.</text><text x="690" y="399" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ovseichik. 19th – early 20th c.</text><rect x="680" y="520" width="290" height="96" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="700" cy="542" r="11" fill="#B00000"/><text x="700" y="546.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">6</text><text x="716" y="540" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">HANGED AND DROWNED, SMOLENSK</text><text x="690" y="566" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A former ban on the common cemetery,</text><text x="690" y="581" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">remembered by people born in the 1930s.</text><text x="690" y="604" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ryko. One district.</text><rect x="361" y="286" width="278" height="208" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="9 5"/><rect x="385" y="310" width="230" height="160" fill="#d9d2c0" stroke="#111111" stroke-width="2.4"/><path d="M411 333.25 L411 346.75 M407.25 337.0 L414.75 337.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M411 375.25 L411 388.75 M407.25 379.0 L414.75 379.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M411 417.25 L411 430.75 M407.25 421.0 L414.75 421.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M453 333.25 L453 346.75 M449.25 337.0 L456.75 337.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M453 375.25 L453 388.75 M449.25 379.0 L456.75 379.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M453 417.25 L453 430.75 M449.25 421.0 L456.75 421.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M495 333.25 L495 346.75 M491.25 337.0 L498.75 337.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M495 375.25 L495 388.75 M491.25 379.0 L498.75 379.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M495 417.25 L495 430.75 M491.25 421.0 L498.75 421.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M537 333.25 L537 346.75 M533.25 337.0 L540.75 337.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M537 375.25 L537 388.75 M533.25 379.0 L540.75 379.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M537 417.25 L537 430.75 M533.25 421.0 L540.75 421.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M579 333.25 L579 346.75 M575.25 337.0 L582.75 337.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M579 375.25 L579 388.75 M575.25 379.0 L582.75 379.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><path d="M579 417.25 L579 430.75 M575.25 421.0 L582.75 421.0" stroke="#8c8574" stroke-width="1.6" fill="none"/><text x="500" y="395" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">COMMON CEMETERY</text><text x="500" y="280" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">FENCE</text><path d="M405 150 l-13 26 h26 z" fill="none" stroke="#111111" stroke-width="1.5"/><line x1="405" y1="176" x2="405" y2="183" stroke="#111111" stroke-width="1.5"/><path d="M437 138 l-13 26 h26 z" fill="none" stroke="#111111" stroke-width="1.5"/><line x1="437" y1="164" x2="437" y2="171" stroke="#111111" stroke-width="1.5"/><path d="M469 154 l-13 26 h26 z" fill="none" stroke="#111111" stroke-width="1.5"/><line x1="469" y1="180" x2="469" y2="187" stroke="#111111" stroke-width="1.5"/><path d="M421 176 l-13 26 h26 z" fill="none" stroke="#111111" stroke-width="1.5"/><line x1="421" y1="202" x2="421" y2="209" stroke="#111111" stroke-width="1.5"/><path d="M453 180 l-13 26 h26 z" fill="none" stroke="#111111" stroke-width="1.5"/><line x1="453" y1="206" x2="453" y2="213" stroke="#111111" stroke-width="1.5"/><text x="437" y="232" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">forest</text><circle cx="484" cy="138" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="484" y="142.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">3</text><path d="M515 190 Q545 140 575 190" fill="none" stroke="#111111" stroke-width="1.6"/><path d="M565 190 Q595 140 625 190" fill="none" stroke="#111111" stroke-width="1.6"/><text x="570" y="232" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">hills</text><circle cx="626" cy="150" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="626" y="154.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">3</text><path d="M361 514 L639 514" stroke="#111111" stroke-width="1.5" stroke-dasharray="2 4"/><text x="500" y="536" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">ditch by the cemetery</text><circle cx="500" cy="514" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="500" y="518.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">3</text><path d="M385 575 q15 -9 30 0 t30 0 t30 0" fill="none" stroke="#111111" stroke-width="1.5"/><path d="M385 593 q15 -9 30 0 t30 0 t30 0" fill="none" stroke="#111111" stroke-width="1.5"/><path d="M385 611 q15 -9 30 0 t30 0 t30 0" fill="none" stroke="#111111" stroke-width="1.5"/><text x="430" y="640" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">swamp</text><circle cx="484" cy="571" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="484" y="575.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">3</text><path d="M550 572 L610 632 M610 572 L550 632" stroke="#111111" stroke-width="3"/><text x="580" y="654" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">crossroads</text><circle cx="626" cy="572" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="626" y="576.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">3</text><circle cx="440" cy="345" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="440" y="349.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">1</text><circle cx="560" cy="435" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="560" y="439.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">4</text><circle cx="361" cy="395" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="361" y="399.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">2</text><rect x="361" y="690" width="278" height="34" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="3 4"/><text x="500" y="711" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">OUTSIDE · PLACE NOT GIVEN</text><circle cx="379" cy="707" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="379" y="711.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">5</text><circle cx="621" cy="707" r="11" fill="#B00000" stroke="#E8E2D4" stroke-width="2"/><text x="621" y="711.5" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">6</text><text x="30" y="758" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">SOLID = reported practice, source read      </text><text x="30" y="773" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">DASHED = memory of informants, or a source read only in part</text><text x="30" y="790" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">The sources disagree: Ryko’s infants lie inside; Ovseichik’s children were kept out. Different regions and decades; the plate does not reconcile</text><text x="30" y="804" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">them.</text><line x1="30" y1="828" x2="970" y2="828" stroke="#111111" stroke-width="0.8"/><text x="30" y="848" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  SOURCES: OVSEICHIK 2022, RYKO 2025, AVDEEV 2019 (ABSTRACT), TOWNSEND 2011</text></svg>
