<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 579" role="img"><rect width="1000" height="579" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="559" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ПОМИНАЛЬНЫЙ ОБЕД КАК РАСЧЁТ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Обед в день похорон по плите D: кого кормят, устойчивая грамматика стола, что он закрывает.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">ДОКУМЕНТИРОВАНО · АЙВАНИЦ 1989</text><text x="30" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">КОГО КОРМЯТ</text><rect x="30" y="142" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Кто омывал</text><rect x="30" y="201" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="231" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Кто копал</text><rect x="30" y="260" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="290" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Кто нёс</text><rect x="30" y="319" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="349" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Кто читал</text><rect x="30" y="378" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="408" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Кто готовил</text><text x="380" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">ОБЕД</text><rect x="380" y="142" width="260" height="66" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Первое блюдо, которое едят прежде</text><text x="390" y="187" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">всего</text><rect x="380" y="216" width="260" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="246" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Место, оставленное умершему</text><rect x="380" y="275" width="260" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Отложенная порция</text><rect x="380" y="334" width="260" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="364" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Еда, которую относят на могилу</text><text x="740" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РАСЧЁТ</text><rect x="740" y="142" width="230" height="81" fill="#E8E2D4" stroke="#B00000" stroke-width="1.6"/><text x="750" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Обязательство дома закрывается</text><text x="750" y="187" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">едой. Отказаться сесть за стол</text><text x="750" y="202" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">значит отказаться от расчёта.</text><path d="M284 281.5 L376 281.5" stroke="#111111" stroke-width="2"/><path d="M370 276.5 L376 281.5 L370 286.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M644 281.5 L736 281.5" stroke="#111111" stroke-width="2"/><path d="M730 276.5 L736 281.5 L730 286.5" fill="none" stroke="#111111" stroke-width="2"/><rect x="30" y="451" width="940" height="66" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="481" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Не всё универсально. В таблице плиты место для умершего и водка у могилы оценены как «средняя» уверенность: описано во многих источниках,</text><text x="40" y="496" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">происхождение и распространённость не установлены.</text><line x1="30" y1="535" x2="970" y2="535" stroke="#111111" stroke-width="0.8"/><text x="30" y="555" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ПО АЙВАНИЦ 1989 В ИЗЛОЖЕНИИ ПЛИТЫ D</text></svg>
