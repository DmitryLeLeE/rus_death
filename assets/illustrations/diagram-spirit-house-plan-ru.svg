 Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">7</text><circle cx="145" cy="225" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="145" y="229.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">8</text><circle cx="350" cy="372" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="350" y="376.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">9</text><rect x="30" y="450" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="470.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДОМОВОЙ</text><text x="40" y="495.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Душа предка, ставшая душой дома; возможно,</text><text x="40" y="510.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">неупокоенная душа родственника.</text><text x="40" y="532.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ансимова и Голубкова</text><circle cx="310" cy="472" r="12" fill="#B00000"/><text x="310" y="476.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">1</text><rect x="350" y="450" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="360" y="470.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДОМОВОЙ, АРХАНГЕЛЬСКАЯ ОБЛ.</text><text x="360" y="495.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Обычно умерший член семьи, первый предок</text><text x="360" y="510.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">рода.</text><text x="360" y="532.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Дранникова; полевые материалы 1990–2012</text><circle cx="630" cy="472" r="12" fill="#B00000"/><text x="630" y="476.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">2</text><rect x="670" y="450" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="680" y="470.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДОМОВОЙ, ПЕРМСКИЙ КРАЙ, 2019</text><text x="680" y="495.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Имена вроде «дедушка» могут указывать на</text><text x="680" y="510.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">предка семьи.</text><text x="680" y="532.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Гранова; одна деревня</text><circle cx="950" cy="472" r="12" fill="#e8b9b0" stroke="#B00000" stroke-width="2.4"/><text x="950" y="476.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">3</text><rect x="30" y="558.0" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="578.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДОМОВОЙ, КАРГОПОЛЬЕ</text><text x="40" y="603.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Связан с культом предков общим утверждением;</text><text x="40" y="618.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">умершим не назван.</text><text x="40" y="640.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Денисевич; студенческая работа</text><circle cx="310" cy="580.0" r="12" fill="#e8b9b0" stroke="#B00000" stroke-width="2.4"/><text x="310" y="584.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">4</text><rect x="350" y="558.0" width="300" height="79.5" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="360" y="578.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">КИКИМОРА</text><text x="360" y="603.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Некрещёные умершие младенцы.</text><text x="360" y="626.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ансимова и Голубкова</text><rect x="619" y="569.0" width="22" height="22" fill="#B00000" transform="rotate(45 630 580.0)"/><text x="630" y="584.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" 