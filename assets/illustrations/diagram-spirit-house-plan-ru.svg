start" font-weight="normal" font-style="normal">Ансимова и Голубкова; Денисевич</text><circle cx="310" cy="688.0" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="310" y="692.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">7</text><rect x="350" y="666.0" width="300" height="79.5" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="360" y="686.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ОВИННИК</text><text x="360" y="711.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Дух овина; связь не названа.</text><text x="360" y="734.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Денисевич</text><circle cx="630" cy="688.0" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="630" y="692.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">8</text><rect x="670" y="666.0" width="300" height="79.5" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="680" y="686.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДВОРОВОЙ</text><text x="680" y="711.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Дух двора; связь не названа.</text><text x="680" y="734.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Денисевич</text><circle cx="950" cy="688.0" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="950" y="692.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">9</text><text x="30" y="784.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">● источник говорит, что дух есть или может быть умершим (предок, родственник)</text><text x="30" y="800.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">◐ связан с культом предков общим утверждением или только как возможность</text><text x="30" y="816.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">○ связь с умершими не названа</text><text x="30" y="832.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">■ связан с определёнными умершими: некрещёнными младенцами</text><line x1="30" y1="850" x2="970" y2="850" stroke="#111111" stroke-width="0.8"/><text x="30" y="870" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ИСТОЧНИКИ: АНСИМОВА И ГОЛУБКОВА 2016, ГРАНОВА 2019, ДРАННИКОВА, ДЕНИСЕВИЧ (КАРГОПОЛЬЕ)</text></svg>
