<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 894" role="img"><rect width="1000" height="894" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="874" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ГДЕ ЖИВЁТ ДУХ И КТО СЧИТАЕТ ЕГО УМЕРШИМ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Схема усадьбы, а не план какой-либо деревни. Знаки показывают, что каждый источник говорит о связи с умершими.</text><rect x="330" y="130" width="340" height="140" fill="#d9d2c0" stroke="#111111" stroke-width="2.4"/><text x="500" y="120" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">ЖИЛОЙ ДОМ</text><rect x="410" y="270" width="180" height="44" fill="none" stroke="#111111" stroke-width="1.6" stroke-dasharray="6 4"/><text x="530" y="300" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">ПОДПОЛЬЕ</text><rect x="60" y="170" width="170" height="100" fill="none" stroke="#111111" stroke-width="2"/><line x1="60" y1="186.6" x2="230" y2="186.6" stroke="#c9c2b0"/><line x1="60" y1="203.2" x2="230" y2="203.2" stroke="#c9c2b0"/><line x1="60" y1="219.8" x2="230" y2="219.8" stroke="#c9c2b0"/><line x1="60" y1="236.4" x2="230" y2="236.4" stroke="#c9c2b0"/><line x1="60" y1="253.0" x2="230" y2="253.0" stroke="#c9c2b0"/><text x="145" y="160" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">ОВИН</text><rect x="790" y="180" width="130" height="90" fill="none" stroke="#111111" stroke-width="2"/><text x="855" y="170" font-family="'Courier New', Courier, 