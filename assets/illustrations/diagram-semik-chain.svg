<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" role="img"><rect width="1000" height="688" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="668" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">SEMIK AND THE DROWNED: WHO REPORTED WHAT, AND THROUGH WHOM WE READ IT</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Each line is a report in Zelenin’s compilation; the originals were not seen. Years are those of the cited work.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">YEAR OF CITED WORK</text><text x="190" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">PLACE</text><text x="380" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">WHAT IS REPORTED</text><text x="700" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">AS CITED BY ZELENIN</text><line x1="30" y1="112" x2="970" y2="112" stroke="#111111" stroke-width="1.5"/><text x="30" y="146" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1807 (publ. 1908)</text><text x="190" y="146" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Khlynov (Vyatka)</text><text x="380" y="146" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Semik Thursday memorial services at the</text><text x="380" y="161" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">former poor-house burial ground, where</text><text x="380" y="176" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">executed criminals and unclaimed poor lay.</text><text x="700" y="146" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Veshchomov, p. 192</text><line x1="30" y1="187" x2="970" y2="187" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="213" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1862</text><text x="190" y="213" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Kotelnich</text><text x="380" y="213" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Festive commemoration, with egg-throwing and</text><text x="380" y="228" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">clay-ball fights.</text><text x="700" y="213" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Glushkov, pp. 27–30</text><line x1="30" y1="239" x2="970" y2="239" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="265" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1894</text><text x="190" y="265" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Smolensk (city)</text><text x="380" y="265" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Memorial service at the Petropavlovsk parish</text><text x="380" y="280" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">cemetery for those who died violent deaths</text><text x="380" y="295" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">and stayed unidentified.</text><text x="700" y="265" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Georgievsky, p. 3</text><line x1="30" y1="306" x2="970" y2="306" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="332" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1904</text><text x="190" y="332" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Ledovo, Yaransk district</text><text x="380" y="332" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Commemoration on the Saturday after Trinity,</text><text x="380" y="347" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">at the site of a former poor house.</text><text x="700" y="332" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Zelenin’s own record,</text><text x="700" y="347" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">p. 161</text><line x1="30" y1="358" x2="970" y2="358" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="384" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1908</text><text x="190" y="384" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Smolensk province</text><text x="380" y="384" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Peasants remember the drowned, the hanged and</text><text x="380" y="399" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">others who died suddenly, on Semik.</text><text x="700" y="384" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Dobrovolsky, p. 14</text><line x1="30" y1="410" x2="970" y2="410" stroke="#c9c2b0" stroke-width="1"/><path d="M500 414 L500 438" stroke="#B00000" stroke-width="2"/><path d="M493 430 L500 438 L507 430" fill="none" stroke="#B00000" stroke-width="2"/><rect x="250" y="438" width="500" height="64" fill="none" stroke="#111111" stroke-width="2.2"/><text x="500" y="460" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">READ HERE THROUGH</text><text x="500" y="478" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">Zelenin 1916, chapter 4, in the 1995 reprint</text><text x="500" y="494" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="normal" font-style="normal">originals not seen</text><rect x="30" y="534" width="940" height="92" fill="none" stroke="#111111" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="554" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">NOT IN THE ZELENIN PASSAGES READ</text><text x="44" y="574" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Smolensk province: no washing, rinsing or work with water on Semik, so no one drowns. Wreaths and birches thrown into rivers;</text><text x="44" y="589" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">floating or sinking read as marriage or death.</text><text x="44" y="608" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="italic">Great Russian Encyclopedia entry: anonymous, undated, no original cited.</text><line x1="30" y1="644" x2="970" y2="644" stroke="#111111" stroke-width="0.8"/><text x="30" y="664" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  SOURCES: ZELENIN 1916 (1995 REPRINT, CH. 4), BRE ‘SEMIK’</text></svg>
