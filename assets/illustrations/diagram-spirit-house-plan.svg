<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 908" role="img"><rect width="1000" height="908" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="888" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">WHERE THE SPIRIT LIVES, AND WHO SAYS IT IS A DEAD PERSON</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">A schematic farmstead, not a plan of any village. Marks show what each source states about a link to the dead.</text><rect x="330" y="130" width="340" height="140" fill="#d9d2c0" stroke="#111111" stroke-width="2.4"/><text x="500" y="120" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">DWELLING HOUSE</text><rect x="410" y="270" width="180" height="44" fill="none" stroke="#111111" stroke-width="1.6" stroke-dasharray="6 4"/><text x="530" y="300" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="italic">CELLAR</text><rect x="60" y="170" width="170" height="100" fill="none" stroke="#111111" stroke-width="2"/><line x1="60" y1="186.6" x2="230" y2="186.6" stroke="#c9c2b0"/><line x1="60" y1="203.2" x2="230" y2="203.2" stroke="#c9c2b0"/><line x1="60" y1="219.8" x2="230" y2="219.8" stroke="#c9c2b0"/><line x1="60" y1="236.4" x2="230" y2="236.4" stroke="#c9c2b0"/><line x1="60" y1="253.0" x2="230" y2="253.0" stroke="#c9c2b0"/><text x="145" y="160" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">THRESHING BARN</text><rect x="790" y="180" width="130" height="90" fill="none" stroke="#111111" stroke-width="2"/><text x="855" y="170" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">BATHHOUSE</text><rect x="200" y="330" width="600" height="80" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="3 5"/><text x="500" y="376" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">YARD</text><circle cx="395" cy="185" r="12" fill="#B00000"/><text x="395" y="189.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">1</text><circle cx="445" cy="215" r="12" fill="#B00000"/><text x="445" y="219.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">2</text><circle cx="560" cy="185" r="12" fill="#e8b9b0" stroke="#B00000" stroke-width="2.4"/><text x="560" y="189.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">3</text><circle cx="610" cy="215" r="12" fill="#e8b9b0" stroke="#B00000" stroke-width="2.4"/><text x="610" y="219.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">4</text><rect x="509" y="234" width="22" height="22" fill="#B00000" transform="rotate(45 520 245)"/><text x="520" y="249.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">5</text><circle cx="440" cy="292" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="440" y="296.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">6</text><circle cx="855" cy="235" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="855" y="239.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">7</text><circle cx="145" cy="225" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="145" y="229.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">8</text><circle cx="350" cy="372" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="350" y="376.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">9</text><rect x="30" y="450" width="300" height="108.5" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="470.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">DOMOVOY</text><text x="40" y="495.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Ancestor’s soul that became the soul of the</text><text x="40" y="510.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">house; possibly a restless soul of a</text><text x="40" y="524.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">relative.</text><text x="40" y="547.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ansimova and Golubkova</text><circle cx="310" cy="472" r="12" fill="#B00000"/><text x="310" y="476.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">1</text><rect x="350" y="450" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="360" y="470.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">DOMOVOY, ARKHANGELSK OBL.</text><text x="360" y="495.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Usually a deceased member of the family,</text><text x="360" y="510.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">first ancestor of the clan.</text><text x="360" y="532.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Drannikova; fieldwork 1990–2012</text><circle cx="630" cy="472" r="12" fill="#B00000"/><text x="630" y="476.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">2</text><rect x="670" y="450" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="680" y="470.0" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">DOMOVOY, PERM, 2019</text><text x="680" y="495.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Names such as ‘grandfather’ may point to a</text><text x="680" y="510.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">family ancestor.</text><text x="680" y="532.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Granova; one village</text><circle cx="950" cy="472" r="12" fill="#e8b9b0" stroke="#B00000" stroke-width="2.4"/><text x="950" y="476.5" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">3</text><rect x="30" y="572.5" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="592.5" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">DOMOVOY, KARGOPOL</text><text x="40" y="618.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Tied to the ancestor cult in a general</text><text x="40" y="632.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">statement; not said to be a dead person.</text><text x="40" y="655.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Denisevich; student work</text><circle cx="310" cy="594.5" r="12" fill="#e8b9b0" stroke="#B00000" stroke-width="2.4"/><text x="310" y="599.0" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">4</text><rect x="350" y="572.5" width="300" height="79.5" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="360" y="592.5" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">KIKIMORA</text><text x="360" y="618.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Unbaptised dead infants.</text><text x="360" y="640.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ansimova and Golubkova</text><rect x="619" y="583.5" width="22" height="22" fill="#B00000" transform="rotate(45 630 594.5)"/><text x="630" y="599.0" font-family="'Courier New', Courier, monospace" font-size="12" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">5</text><rect x="670" y="572.5" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="680" y="592.5" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">FEMALE SPIRIT IN THE CELLAR</text><text x="680" y="618.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Harmful; not recorded elsewhere in the Perm</text><text x="680" y="632.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">archives read.</text><text x="680" y="655.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Granova; one village</text><circle cx="950" cy="594.5" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="950" y="599.0" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">6</text><rect x="30" y="680.5" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="700.5" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">BANNIK / BAENNIK</text><text x="40" y="726.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Set apart as most dangerous; no ancestor</text><text x="40" y="740.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">link stated.</text><text x="40" y="763.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ansimova and Golubkova; Denisevich</text><circle cx="310" cy="702.5" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="310" y="707.0" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">7</text><rect x="350" y="680.5" width="300" height="94.0" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="360" y="700.5" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">OVINNIK</text><text x="360" y="726.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Spirit of the threshing barn; no link</text><text x="360" y="740.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">stated.</text><text x="360" y="763.0" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Denisevich</text><circle cx="630" cy="702.5" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="630" y="707.0" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">8</text><rect x="670" y="680.5" width="300" height="79.5" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="680" y="700.5" font-family="'Courier New', Courier, monospace" font-size="11.0" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">DVOROVOY</text><text x="680" y="726.0" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Spirit of the yard; no link stated.</text><text x="680" y="748.5" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Denisevich</text><circle cx="950" cy="702.5" r="12" fill="#E8E2D4" stroke="#111111" stroke-width="2"/><text x="950" y="707.0" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">9</text><text x="30" y="798.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">● the source says the spirit is, or may be, a dead person (ancestor or relative)</text><text x="30" y="814.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">◐ tied to the ancestor cult in a general statement, or a possibility only</text><text x="30" y="830.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">○ no link to the dead stated</text><text x="30" y="846.5" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">■ linked to a particular dead: unbaptised infants</text><line x1="30" y1="864" x2="970" y2="864" stroke="#111111" stroke-width="0.8"/><text x="30" y="884" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  SOURCES: ANSIMOVA AND GOLUBKOVA 2016, GRANOVA 2019, DRANNIKOVA, DENISEVICH (KARGOPOL)</text></svg>
