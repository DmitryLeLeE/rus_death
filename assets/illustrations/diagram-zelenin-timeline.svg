<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><rect width="1000" height="420" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="400" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">HOW THE CATEGORY WAS BUILT</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Zelenin's 'pledged dead': 1909 to 1916, as stated in his own preface</text><line x1="90" y1="170" x2="910" y2="170" stroke="#111111" stroke-width="2"/><circle cx="190" cy="170" r="9" fill="#B00000"/><text x="190" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">1909</text><text x="190" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">NON-RUSSIAN RITE</text><text x="190" y="212" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Summer fieldwork among the</text><text x="190" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Besermyans, Vyatka province:</text><text x="190" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">offering 'kuyas'kon' to people</text><text x="190" y="266" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">dead young by unnatural death</text><circle cx="500" cy="170" r="9" fill="#B00000"/><text x="500" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">1911</text><text x="500" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">RUSSIAN AND FINNISH REPORTS</text><text x="500" y="212" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Article in Zhivaya starina:</text><text x="500" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">cult of the unnaturally dead</text><text x="500" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">among Russians and Finns</text><text x="500" y="266" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">(Russians and Finns added)</text><circle cx="810" cy="170" r="9" fill="#B00000"/><text x="810" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">1916</text><text x="810" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">NAMED CATEGORY</text><text x="810" y="212" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Book, Petrograd, A. V. Orlov,</text><text x="810" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">328 pp.: the dead by unnatural</text><text x="810" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">death and rusalki; the category</text><text x="810" y="266" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">set out in book form</text><path d="M205 170 L485 170" stroke="#B00000" stroke-width="3" stroke-dasharray="2 7"/><path d="M515 170 L795 170" stroke="#B00000" stroke-width="3" stroke-dasharray="2 7"/><text x="30" y="340" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">INTERPRETATION: the plate reads this order as one reason for caution,</text><text x="30" y="357" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">not as proof that the category fails. Only the preface was read.</text><line x1="30" y1="376" x2="970" y2="376" stroke="#111111" stroke-width="0.8"/><text x="30" y="396" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  SOURCES: ZELENIN PREFACE (2024 REISSUE), WIKISOURCE IMPRINT</text></svg>
