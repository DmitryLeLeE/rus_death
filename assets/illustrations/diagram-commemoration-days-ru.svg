<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" role="img"><rect width="1000" height="622" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="602" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">СОРОК ДНЕЙ В ДВУХ РЕГИСТРАХ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Над линией: причины, названные в церковном требнике. Под линией, пунктиром: то, что атлас относит к народному развитию.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">ДОКТРИНА · ДОКУМЕНТИРОВАНО</text><rect x="30" y="116" width="220" height="110" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ТРЕТИЙ ДЕНЬ</text><text x="40" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Названная причина:</text><text x="40" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Воскресение.</text><text x="40" y="200" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">«Новая скрижаль» (1803), в</text><text x="40" y="214" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">пересказе атласа.</text><rect x="270" y="116" width="220" height="96" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="280" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДЕВЯТЫЙ ДЕНЬ</text><text x="280" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Названная причина: девять</text><text x="280" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ангельских чинов.</text><text x="280" y="200" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">«Новая скрижаль» (1803).</text><rect x="510" y="116" width="220" height="111" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="520" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">СОРОКОВОЙ ДЕНЬ</text><text x="520" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Названная причина: Вознесение</text><text x="520" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">на сороковой день. Последнее</text><text x="520" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">из установленных поминовений.</text><text x="520" y="215" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">«Новая скрижаль» (1803).</text><rect x="750" y="116" width="220" height="111" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="760" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ГОД</text><text x="760" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Годовое поминовение</text><text x="760" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">продолжается после сорокового</text><text x="760" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">дня.</text><text x="760" y="215" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Плита H, по тому же требнику.</text><line x1="30" y1="279" x2="970" y2="279" stroke="#111111" stroke-width="2.4"/><line x1="60" y1="271" x2="60" y2="287" stroke="#111111" stroke-width="2.4"/><text x="60" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">СМЕРТЬ</text><line x1="140.0" y1="271" x2="140.0" y2="287" stroke="#111111" stroke-width="2.4"/><text x="140.0" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">3-Й ДЕНЬ</text><line x1="380.0" y1="271" x2="380.0" y2="287" stroke="#111111" stroke-width="2.4"/><text x="380.0" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">9-Й ДЕНЬ</text><line x1="620.0" y1="271" x2="620.0" y2="287" stroke="#111111" stroke-width="2.4"/><text x="620.0" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">40-Й ДЕНЬ</text><line x1="860.0" y1="271" x2="860.0" y2="287" stroke="#111111" stroke-width="2.4"/><text x="860.0" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">ГОД</text><path d="M140.0 227 L140.0 271" stroke="#c9c2b0" stroke-width="1.2"/><path d="M380.0 227 L380.0 271" stroke="#c9c2b0" stroke-width="1.2"/><path d="M620.0 227 L620.0 271" stroke="#c9c2b0" stroke-width="1.2"/><path d="M860.0 227 L860.0 271" stroke="#c9c2b0" stroke-width="1.2"/><text x="30" y="341" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">НАРОДНОЕ РАЗВИТИЕ · ИНТЕРПРЕТАЦИЯ</text><rect x="30" y="353" width="470" height="81" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="373" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДО СОРОКОВОГО ДНЯ</text><text x="40" y="399" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Душа задерживается, блуждает, навещает дом и нуждается в пище.</text><text x="40" y="422" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Айваниц 1989, по таблице плиты.</text><rect x="510" y="353" width="220" height="81" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="520" y="373" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">В СОРОКОВОЙ ДЕНЬ</text><text x="520" y="399" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Душа уходит после странствия.</text><text x="520" y="422" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Айваниц 1989.</text><rect x="30" y="464" width="940" height="96" fill="#E8E2D4" stroke="#B00000" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="484" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">МЫТАРСТВА · НА ЛИНИЮ НЕ ПОСТАВЛЕНЫ</text><text x="40" y="510" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Видение Феодоры в Житии св. Василия Нового: ангелы ведут умершую женщину через испытания, где злые духи пытаются завладеть её душой.</text><text x="40" y="525" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Агиографическое повествование, широко принятое, но никогда не обязательный догмат. Испытания здесь не перечислены: само Житие не читалось.</text><text x="40" y="548" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Богословская статья, цитирующая «Православную энциклопедию».</text><line x1="30" y1="578" x2="970" y2="578" stroke="#111111" stroke-width="0.8"/><text x="30" y="598" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ИСТОЧНИКИ: «НОВАЯ СКРИЖАЛЬ» 1803, АЙВАНИЦ 1989, СТАТЬЯ AZBYKA О МЫТАРСТВАХ</text></svg>
