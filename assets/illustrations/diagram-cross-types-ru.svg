<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="ТИПОЛОГИЯ НАДМОГИЛЬНЫХ ЗНАКОВ РУССКОГО СЕВЕРА">
  <rect width="1000" height="700" fill="#E8E2D4"/>
  <rect x="12" y="12" width="976" height="676" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="52" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#111111">ТИПОЛОГИЯ НАДМОГИЛЬНЫХ ЗНАКОВ РУССКОГО СЕВЕРА</text>
  <text x="36" y="76" font-family="'Courier New', monospace" font-size="12" fill="#555555">Эволюция надгробия: от старообрядческого голубца к советскому обелиску</text>
  <line x1="36" y1="92" x2="964" y2="92" stroke="#111111" stroke-width="1"/>

  <!-- Ground line -->
  <line x1="36" y1="520" x2="964" y2="520" stroke="#111111" stroke-width="2"/>
  <text x="964" y="540" font-family="'Courier New', monospace" font-size="10" fill="#666666" text-anchor="end">HORIZON / УРОВЕНЬ ПОЧВЫ</text>

  <!-- COLUMN 1: Golubets -->
  <g transform="translate(130, 0)">
    <!-- Upright beam -->
    <rect x="-10" y="220" width="20" height="300" fill="#D9D2C0" stroke="#111111" stroke-width="1.8"/>
    <!-- Crossbar -->
    <rect x="-60" y="270" width="120" height="18" fill="#D9D2C0" stroke="#111111" stroke-width="1.8"/>
    <!-- Roof gable -->
    <polygon points="0,170 -80,230 -65,245 0,195 65,245 80,230" fill="#B3241A" stroke="#111111" stroke-width="1.5"/>
    <!-- Icon niche -->
    <rect x="-18" y="280" width="36" height="50" fill="#C9C2B0" stroke="#111111" stroke-width="1.2"/>
    <rect x="-12" y="286" width="24" height="38" fill="#111111"/>
  </g>
  <text x="130" y="560" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#B3241A" text-anchor="middle">01. СТАРООБРЯДЧЕСКИЙ ГОЛУБЕЦ</text>
  <text x="130" y="582" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Двускатная кровля-теремок</text>
  <text x="130" y="600" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Киотец с медной литой иконкой</text>
  <text x="130" y="618" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Подсечка и резные причелины</text>

  <!-- COLUMN 2: 8-pointed cross -->
  <g transform="translate(380, 0)">
    <!-- Upright shaft -->
    <rect x="-9" y="160" width="18" height="360" fill="#D9D2C0" stroke="#111111" stroke-width="1.8"/>
    <!-- Top titulus bar -->
    <rect x="-30" y="200" width="60" height="14" fill="#D9D2C0" stroke="#111111" stroke-width="1.5"/>
    <!-- Middle arm bar -->
    <rect x="-75" y="260" width="150" height="18" fill="#D9D2C0" stroke="#111111" stroke-width="1.8"/>
    <!-- Slanted footrest bar -->
    <polygon points="-38,410 38,380 44,394 -32,424" fill="#D9D2C0" stroke="#111111" stroke-width="1.8"/>
  </g>
  <text x="380" y="560" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#B3241A" text-anchor="middle">02. ОСЬМИКОНЕЧНЫЙ КРЕСТ</text>
  <text x="380" y="582" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Верхняя табличка («титла»)</text>
  <text x="380" y="600" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Средняя перекладина для рук</text>
  <text x="380" y="618" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Косая подножка (весы праведные)</text>

  <!-- COLUMN 3: Pomor column -->
  <g transform="translate(630, 0)">
    <!-- Column trunk -->
    <rect x="-14" y="200" width="28" height="320" fill="#D9D2C0" stroke="#111111" stroke-width="1.8"/>
    <!-- Carved boat hood top -->
    <polygon points="0,170 -40,210 40,210" fill="#B3241A" stroke="#111111" stroke-width="1.5"/>
    <!-- Rosette incisions -->
    <circle cx="0" cy="250" r="10" fill="none" stroke="#111111" stroke-width="1.5"/>
    <circle cx="0" cy="250" r="3" fill="#111111"/>
    <line x1="0" y1="237" x2="0" y2="263" stroke="#111111" stroke-width="1.2"/>
    <line x1="-13" y1="250" x2="13" y2="250" stroke="#111111" stroke-width="1.2"/>
  </g>
  <text x="630" y="560" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#B3241A" text-anchor="middle">03. ПОМОРСКИЙ СТОЛБЕЦ</text>
  <text x="630" y="582" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Брус со стрельчатой стрехой</text>
  <text x="630" y="600" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Резные солярные розетки</text>
  <text x="630" y="618" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Ориентация изголовьем на восток</text>

  <!-- COLUMN 4: Soviet tin pyramid -->
  <g transform="translate(870, 0)">
    <!-- Metal pyramid body -->
    <polygon points="0,210 -45,520 45,520" fill="#B0B8C0" stroke="#111111" stroke-width="1.8"/>
    <!-- Star on pinnacle -->
    <path d="M 0 170 L 6 186 L 22 186 L 10 196 L 14 212 L 0 202 L -14 212 L -10 196 L -22 186 L -6 186 Z" fill="#B3241A" stroke="#111111" stroke-width="1.2"/>
    <!-- Photo-oval plaque -->
    <ellipse cx="0" cy="330" rx="16" ry="22" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <ellipse cx="0" cy="330" rx="12" ry="17" fill="#666666"/>
  </g>
  <text x="870" y="560" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#B3241A" text-anchor="middle">04. СОВЕТСКАЯ ПИРАМИДКА</text>
  <text x="870" y="582" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Сварной листовой конус</text>
  <text x="870" y="600" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Красная жестяная пятиконечная звезда</text>
  <text x="870" y="618" font-family="Georgia, serif" font-size="11" fill="#222222" text-anchor="middle">Эмалированный фотоовал</text>

  <!-- Footer citation -->
  <line x1="36" y1="662" x2="964" y2="662" stroke="#CCCCCC" stroke-width="1"/>
  <text x="36" y="678" font-family="'Courier New', monospace" font-size="10" fill="#666666">Источники: Руйе (2007, с. 65); Чистов (1986, с. 142); Мерридейл (2000, с. 210).</text>
</svg>