<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img"><rect width="1000" height="410" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="390" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">СТРАНИЦА УМЕРШЕГО КАК ПРОЦЕДУРА</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Как политику «ВКонтакте» описывает новостная заметка; дата заметки в прочитанном отрывке не видна</text><rect x="60" y="110" width="260" height="74" fill="none" stroke="#111111" stroke-width="2"/><text x="190" y="142" font-family="'Courier New', Courier, monospace" font-size="14" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">РОДСТВЕННИКИ</text><text x="190" y="164" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">обращаются в сервис</text><path d="M322 147 L366 147" stroke="#B00000" stroke-width="3"/><path d="M358 140 L368 147 L358 154" fill="none" stroke="#B00000" stroke-width="3"/><rect x="370" y="110" width="260" height="74" fill="none" stroke="#111111" stroke-width="2"/><text x="500" y="142" font-family="'Courier New', Courier, monospace" font-size="14" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">ФОТО</text><text x="500" y="164" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">свидетельства о смерти</text><path d="M632 147 L676 147" stroke="#B00000" stroke-width="3"/><path d="M668 140 L678 147 L668 154" fill="none" stroke="#B00000" stroke-width="3"/><rect x="680" y="110" width="260" height="74" fill="none" stroke="#111111" stroke-width="2"/><text x="810" y="142" font-family="'Courier New', Courier, monospace" font-size="14" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">ВК РЕШАЕТ</text><text x="810" y="164" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">по запросу</text><path d="M810 186 L810 220 L340 220 L340 238" fill="none" stroke="#B00000" stroke-width="2"/><path d="M790 220 L790 238" fill="none" stroke="#B00000" stroke-width="2"/><rect x="60" y="240" width="560" height="52" fill="none" stroke="#111111"/><text x="70" y="263" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">СОХРАНИТЬ: страница остаётся; вместо времени</text><text x="70" y="281" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">визита — «Страница умершего человека»</text><rect x="640" y="240" width="300" height="52" fill="none" stroke="#111111"/><text x="650" y="263" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">УДАЛИТЬ:</text><text x="650" y="281" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">страница удаляется</text><text x="30" y="332" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">В той же заметке: «Одноклассники» ставят чёрную ленту или делают фото чёрно-белым;</text><text x="30" y="350" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">у Facebook есть «контакт для наследия» и пометка памяти.</text><line x1="30" y1="366" x2="970" y2="366" stroke="#111111" stroke-width="0.8"/><text x="30" y="386" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ИСТОЧНИК: ЗАМЕТКА RTVI; СПРАВКА ПЛАТФОРМ НЕ ЧИТАЛАСЬ; ПРАВИЛА МОГЛИ ИЗМЕНИТЬСЯ</text></svg>
