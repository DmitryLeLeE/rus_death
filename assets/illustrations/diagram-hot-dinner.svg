<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 579" role="img"><rect width="1000" height="579" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="559" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">THE HOT DINNER AS AN ACCOUNT</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Plate D’s description of the burial-day meal: who is fed, the fixed grammar of the table, what it settles.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">DOCUMENTED · IVANITS 1989</text><text x="30" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">WHO IS FED</text><rect x="30" y="142" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Those who washed</text><rect x="30" y="201" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="231" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Those who dug</text><rect x="30" y="260" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="290" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Those who carried</text><rect x="30" y="319" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="349" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Those who read</text><rect x="30" y="378" width="250" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="408" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Those who cooked</text><text x="380" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">THE MEAL</text><rect x="380" y="142" width="260" height="66" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A first course, eaten before</text><text x="390" y="187" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">anything else</text><rect x="380" y="216" width="260" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="246" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A place kept for the dead</text><rect x="380" y="275" width="260" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A portion set aside</text><rect x="380" y="334" width="260" height="51" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="390" y="364" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Food carried to the grave</text><text x="740" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">THE ACCOUNT</text><rect x="740" y="142" width="230" height="96" fill="#E8E2D4" stroke="#B00000" stroke-width="1.6"/><text x="750" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">The household’s obligation is</text><text x="750" y="187" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">discharged in food. To refuse</text><text x="750" y="202" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">the table is to refuse the</text><text x="750" y="217" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">account.</text><path d="M284 281.5 L376 281.5" stroke="#111111" stroke-width="2"/><path d="M370 276.5 L376 281.5 L370 286.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M644 281.5 L736 281.5" stroke="#111111" stroke-width="2"/><path d="M730 276.5 L736 281.5 L730 286.5" fill="none" stroke="#111111" stroke-width="2"/><rect x="30" y="451" width="940" height="66" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="481" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Not every element is universal. The plate’s own table rates the place for the dead and vodka at the graveside as ‘medium’: reported in many</text><text x="40" y="496" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">accounts, origin or universality not established.</text><line x1="30" y1="535" x2="970" y2="535" stroke="#111111" stroke-width="0.8"/><text x="30" y="555" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  AFTER IVANITS 1989 AS SET OUT ON PLATE D</text></svg>
