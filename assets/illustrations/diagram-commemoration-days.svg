<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 652" role="img"><rect width="1000" height="652" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="632" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">THE FORTY DAYS, IN TWO REGISTERS</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Above the line: the Church handbook’s stated reasons. Below, dashed: what the atlas files as folk elaboration.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">DOCTRINE · DOCUMENTED</text><rect x="30" y="116" width="220" height="110" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="40" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">THIRD DAY</text><text x="40" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Reason given: the</text><text x="40" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Resurrection.</text><text x="40" y="200" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Novaia Skrizhal’ (1803), as</text><text x="40" y="214" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">summarised in this atlas.</text><rect x="270" y="116" width="220" height="96" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="280" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">NINTH DAY</text><text x="280" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Reason given: the nine ranks</text><text x="280" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">of angels.</text><text x="280" y="200" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Novaia Skrizhal’ (1803).</text><rect x="510" y="116" width="220" height="126" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="520" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">FORTIETH DAY</text><text x="520" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Reason given: the Ascension,</text><text x="520" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">on the fortieth day. The last</text><text x="520" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">of the appointed</text><text x="520" y="207" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">commemorations.</text><text x="520" y="230" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Novaia Skrizhal’ (1803).</text><rect x="750" y="116" width="220" height="111" fill="#E8E2D4" stroke="#111111" stroke-width="1.6"/><text x="760" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">THE YEAR</text><text x="760" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">The annual commemoration</text><text x="760" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">continues after the fortieth</text><text x="760" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">day.</text><text x="760" y="215" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Plate H, from the same handbook.</text><line x1="30" y1="294" x2="970" y2="294" stroke="#111111" stroke-width="2.4"/><line x1="60" y1="286" x2="60" y2="302" stroke="#111111" stroke-width="2.4"/><text x="60" y="320" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">DEATH</text><line x1="140.0" y1="286" x2="140.0" y2="302" stroke="#111111" stroke-width="2.4"/><text x="140.0" y="320" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">DAY 3</text><line x1="380.0" y1="286" x2="380.0" y2="302" stroke="#111111" stroke-width="2.4"/><text x="380.0" y="320" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">DAY 9</text><line x1="620.0" y1="286" x2="620.0" y2="302" stroke="#111111" stroke-width="2.4"/><text x="620.0" y="320" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">DAY 40</text><line x1="860.0" y1="286" x2="860.0" y2="302" stroke="#111111" stroke-width="2.4"/><text x="860.0" y="320" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">THE YEAR</text><path d="M140.0 242 L140.0 286" stroke="#c9c2b0" stroke-width="1.2"/><path d="M380.0 242 L380.0 286" stroke="#c9c2b0" stroke-width="1.2"/><path d="M620.0 242 L620.0 286" stroke="#c9c2b0" stroke-width="1.2"/><path d="M860.0 242 L860.0 286" stroke="#c9c2b0" stroke-width="1.2"/><text x="30" y="356" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">FOLK ELABORATION · INTERPRETATION</text><rect x="30" y="368" width="470" height="81" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="388" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">UP TO THE FORTIETH DAY</text><text x="40" y="414" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">The soul lingers, wanders, visits the house and needs to be fed.</text><text x="40" y="437" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ivanits 1989, as set out in the plate’s table.</text><rect x="510" y="368" width="220" height="96" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="520" y="388" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">AT THE FORTIETH DAY</text><text x="520" y="414" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">The soul departs, after a</text><text x="520" y="429" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">journey.</text><text x="520" y="452" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Ivanits 1989.</text><rect x="30" y="494" width="940" height="96" fill="#E8E2D4" stroke="#B00000" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="514" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">TOLL-HOUSES · NOT PLACED ON THE LINE</text><text x="40" y="540" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">The vision of Theodora in the Life of St Basil the New: angels lead the dead woman through trials where evil spirits try to claim her soul.</text><text x="40" y="555" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A hagiographic narrative, widely received, never a binding dogma. The trials are not listed here because the Life itself was not read.</text><text x="40" y="578" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Orthodox theological article citing the Orthodox Encyclopedia.</text><line x1="30" y1="608" x2="970" y2="608" stroke="#111111" stroke-width="0.8"/><text x="30" y="628" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  SOURCES: NOVAIA SKRIZHAL’ 1803, IVANITS 1989, AZBYKA ‘MYTARSTVA’ ARTICLE</text></svg>
