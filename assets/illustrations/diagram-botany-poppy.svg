<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #0d0c0b; }
      .frame { stroke: #423d33; stroke-width: 1.5; fill: none; }
      .inner-frame { stroke: #2a2620; stroke-width: 0.8; fill: none; }
      .title { font-family: 'Anton', 'Cinzel', serif; font-size: 26px; fill: #e8e4dc; letter-spacing: 0.12em; }
      .sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: #9c9588; font-style: italic; letter-spacing: 0.05em; }
      .latin { font-family: 'Inter', sans-serif; font-size: 11px; fill: #b13227; font-weight: bold; letter-spacing: 0.15em; }
      .plate-no { font-family: 'Anton', monospace; font-size: 14px; fill: #b13227; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg" />
  
  <!-- Outer & Inner Archival Frames -->
  <rect x="25" y="25" width="850" height="550" class="frame" />
  <rect x="33" y="33" width="834" height="534" class="inner-frame" />
  
  <!-- Header Block -->
  <g transform="translate(60, 68)">
    <text x="0" y="0" class="latin">PAPAVER RHOEAS / SOMNIFERUM L.</text>
    <text x="0" y="28" class="title">WILD POPPY SEEDS</text>
    <text x="0" y="48" class="sub">Innumerable counting barrier of threshold &amp; grave</text>
  </g>
  <text x="840" y="70" class="plate-no" text-anchor="end">HERBARIUM CHTHONICUM</text>

  <!-- Botanical Artwork -->
  
        <g stroke="#e2ded4" stroke-width="2.5" fill="none" stroke-linecap="round">
          <!-- Central Poppy Stem -->
          <path d="M 450 540 C 450 420, 440 280, 450 180" />
          <!-- Flower bud / pod -->
          <path d="M 420 180 C 410 120, 490 120, 480 180 Z" fill="#1b1815" stroke="#b13227" stroke-width="2" />
          <!-- Starry crown -->
          <path d="M 410 120 L 490 120 L 485 105 L 470 112 L 450 102 L 430 112 L 415 105 Z" fill="#2a2520" stroke="#b13227" stroke-width="1.8" />
          <!-- Pores under crown -->
          <circle cx="430" cy="135" r="2.5" fill="#e2ded4" />
          <circle cx="443" cy="135" r="2.5" fill="#e2ded4" />
          <circle cx="457" cy="135" r="2.5" fill="#e2ded4" />
          <circle cx="470" cy="135" r="2.5" fill="#e2ded4" />
          <!-- Falling seed stream -->
          <path d="M 450 190 Q 420 320 340 420" stroke="#7a756b" stroke-dasharray="3,6" stroke-width="1.5" />
          <path d="M 450 190 Q 480 320 540 450" stroke="#7a756b" stroke-dasharray="3,6" stroke-width="1.5" />
        </g>
        <!-- Scattered tiny seeds (circles) -->
        <g fill="#e2ded4">
          <circle cx="340" cy="425" r="3" /><circle cx="355" cy="440" r="2.5" /><circle cx="330" cy="445" r="3.2" />
          <circle cx="370" cy="430" r="2" /><circle cx="320" cy="460" r="2.8" /><circle cx="360" cy="465" r="3" />
          <circle cx="535" cy="455" r="3" /><circle cx="550" cy="470" r="2.5" /><circle cx="520" cy="480" r="3.2" />
          <circle cx="565" cy="460" r="2.2" /><circle cx="545" cy="495" r="3" /><circle cx="575" cy="490" r="2.7" />
          <circle cx="445" cy="490" r="3" /><circle cx="460" cy="510" r="2.5" /><circle cx="430" cy="520" r="3.2" />
        </g>
        

  <!-- Callouts -->
  <g class="callout">
          <circle cx="660" cy="195" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="660" y="200" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">1</text>
          <text x="680" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Porous capsule containing thousands of seeds</text>
        </g>
<g class="callout">
          <circle cx="630" cy="85" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="630" y="90" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">2</text>
          <text x="650" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Stigmatic disc sealing the seed chamber</text>
        </g>
<g class="callout">
          <circle cx="160" cy="235" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="160" y="240" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">3</text>
          <text x="180" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Scattering ritual at funeral crossroads</text>
        </g>
<g class="callout">
          <circle cx="190" cy="475" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="190" y="480" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">4</text>
          <text x="210" y="480" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Counting until cockcrow (disables revenant)</text>
        </g>

  <!-- Footer metadata -->
  <g transform="translate(60, 555)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#7a756b" letter-spacing="0.08em">RUSSIAN CHTHONIC ATLAS · SECTION BOTANICA</text>
    <text x="780" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#7a756b" text-anchor="end">ARCHIVAL RECONSTRUCTION · CC BY-SA 4.0</text>
  </g>
</svg>