<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><rect width="1000" height="420" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="400" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">КАК СОБИРАЛАСЬ КАТЕГОРИЯ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">«Заложные» Зеленина: 1909–1916, по его собственному предисловию</text><line x1="90" y1="170" x2="910" y2="170" stroke="#111111" stroke-width="2"/><circle cx="190" cy="170" r="9" fill="#B00000"/><text x="190" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">1909</text><text x="190" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">НЕРУССКИЙ ОБРЯД</text><text x="190" y="212" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Летняя полевая работа среди</text><text x="190" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">бесермян Вятской губернии:</text><text x="190" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">жертва «куяськон» умершим</text><text x="190" y="266" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">рано неестественной смертью</text><circle cx="500" cy="170" r="9" fill="#B00000"/><text x="500" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">1911</text><text x="500" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">РУССКИЕ И ФИННСКИЕ СООБЩЕНИЯ</text><text x="500" y="212" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Статья в «Живой старине»:</text><text x="500" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">культ умерших неестественной</text><text x="500" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">смертью у русских и финнов</text><text x="500" y="266" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">(добавлены русские и финны)</text><circle cx="810" cy="170" r="9" fill="#B00000"/><text x="810" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">1916</text><text x="810" y="112" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">ИМЕНОВАННАЯ КАТЕГОРИЯ</text><text x="810" y="212" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">Книга, Петроград, А. В. Орлов,</text><text x="810" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">328 с.: умершие неестественной</text><text x="810" y="248" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">смертью и русалки; категория</text><text x="810" y="266" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-style="normal">изложена книгой</text><path d="M205 170 L485 170" stroke="#B00000" stroke-width="3" stroke-dasharray="2 7"/><path d="M515 170 L795 170" stroke="#B00000" stroke-width="3" stroke-dasharray="2 7"/><text x="30" y="340" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ИНТЕРПРЕТАЦИЯ: лист читает этот порядок как причину осторожности,</text><text x="30" y="357" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">а не как доказательство, что категория неверна. Читалось только предисловие.</text><line x1="30" y1="376" x2="970" y2="376" stroke="#111111" stroke-width="0.8"/><text x="30" y="396" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ИСТОЧНИКИ: ПРЕДИСЛОВИЕ ЗЕЛЕНИНА (ПЕРЕИЗДАНИЕ 2024), ВИКИТЕКА</text></svg>
