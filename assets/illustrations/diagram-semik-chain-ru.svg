<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" role="img"><rect width="1000" height="688" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="668" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">СЕМИК И УТОПЛЕННИКИ: КТО ЧТО СООБЩИЛ И ЧЕРЕЗ КОГО МЫ ЭТО ЧИТАЕМ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Каждая строка — сообщение в компиляции Зеленина; оригиналы не видели. Годы — годы цитируемой работы.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">ГОД РАБОТЫ</text><text x="190" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">МЕСТО</text><text x="380" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">ЧТО СООБЩАЕТСЯ</text><text x="700" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">КАК ЦИТИРУЕТ ЗЕЛЕНИН</text><line x1="30" y1="112" x2="970" y2="112" stroke="#111111" stroke-width="1.5"/><text x="30" y="146" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1807 (изд. 1908)</text><text x="190" y="146" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Хлынов (Вятка)</text><text x="380" y="146" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">В семицкий четверг панихиды на бывшем убогом</text><text x="380" y="161" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">доме, где лежали казнённые преступники и</text><text x="380" y="176" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">безродные бедняки.</text><text x="700" y="146" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Вещомов, с. 192</text><line x1="30" y1="187" x2="970" y2="187" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="213" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1862</text><text x="190" y="213" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Котельнич</text><text x="380" y="213" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Праздничное поминовение, с бросанием яиц и</text><text x="380" y="228" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">боем глиняных шаров.</text><text x="700" y="213" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Глушков, с. 27–30</text><line x1="30" y1="239" x2="970" y2="239" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="265" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1894</text><text x="190" y="265" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Смоленск (город)</text><text x="380" y="265" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Панихида на Петропавловском приходском</text><text x="380" y="280" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">кладбище по умершим насильственной смертью и</text><text x="380" y="295" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">неопознанным.</text><text x="700" y="265" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Георгиевский, с. 3</text><line x1="30" y1="306" x2="970" y2="306" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="332" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1904</text><text x="190" y="332" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Ледово, Яранский уезд</text><text x="380" y="332" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Поминовение в субботу после Троицы на месте</text><text x="380" y="347" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">бывшего убогого дома.</text><text x="700" y="332" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Собственная запись</text><text x="700" y="347" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Зеленина, с. 161</text><line x1="30" y1="358" x2="970" y2="358" stroke="#c9c2b0" stroke-width="1"/><text x="30" y="384" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">1908</text><text x="190" y="384" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">Смоленская губерния</text><text x="380" y="384" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Крестьяне поминают на Семик утопленников,</text><text x="380" y="399" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">повешенных и других внезапно умерших.</text><text x="700" y="384" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Добровольский, с. 14</text><line x1="30" y1="410" x2="970" y2="410" stroke="#c9c2b0" stroke-width="1"/><path d="M500 414 L500 438" stroke="#B00000" stroke-width="2"/><path d="M493 430 L500 438 L507 430" fill="none" stroke="#B00000" stroke-width="2"/><rect x="250" y="438" width="500" height="64" fill="none" stroke="#111111" stroke-width="2.2"/><text x="500" y="460" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="middle" font-weight="bold" font-style="normal">ЧИТАЕТСЯ ЗДЕСЬ ЧЕРЕЗ</text><text x="500" y="478" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">Зеленин 1916, гл. 4, по переизданию 1995</text><text x="500" y="494" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="normal" font-style="normal">оригиналы не видели</text><rect x="30" y="534" width="940" height="92" fill="none" stroke="#111111" stroke-width="1.6" stroke-dasharray="6 4"/><text x="44" y="554" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">НЕТ В ПРОЧИТАННЫХ ОТРЫВКАХ ЗЕЛЕНИНА</text><text x="44" y="574" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Смоленская губерния: на Семик не стирают, не полощут и не работают с водой, чтобы никто не утонул. Венки и берёзки бросают в реки;</text><text x="44" y="589" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">всплыл или утонул венок — знак брака или смерти.</text><text x="44" y="608" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="italic">Статья БРЭ: без автора, без даты, оригинал не указан.</text><line x1="30" y1="644" x2="970" y2="644" stroke="#111111" stroke-width="0.8"/><text x="30" y="664" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ИСТОЧНИКИ: ЗЕЛЕНИН 1916 (ПЕРЕИЗДАНИЕ 1995, ГЛ. 4), БРЭ «СЕМИК»</text></svg>
