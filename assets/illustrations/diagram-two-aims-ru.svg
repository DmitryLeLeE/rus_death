<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><rect width="1000" height="460" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="440" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ОТКРЫТАЯ ГРАНИЦА, ЗАЩИТНЫЕ ДЕЙСТВИЯ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">По статье БРЭ о восточнославянских похоронах: статья не даёт ни даты, ни причины для каждого действия; расстояния схематичны</text><rect x="90" y="108" width="820" height="26" fill="#B00000"/><text x="660" y="126" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E8E2D4" text-anchor="middle" font-weight="bold" font-style="normal">ГРАНИЦА МЕЖДУ МИРАМИ ОСТАЁТСЯ ОТКРЫТОЙ</text><line x1="90" y1="100" x2="90" y2="150" stroke="#111111" stroke-width="2"/><text x="90" y="168" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">СМЕРТЬ</text><line x1="400" y1="100" x2="400" y2="150" stroke="#111111" stroke-width="2"/><text x="400" y="168" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">ПОГРЕБЕНИЕ</text><line x1="910" y1="100" x2="910" y2="150" stroke="#111111" stroke-width="2"/><text x="910" y="168" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="middle" font-weight="bold" font-style="normal">40-Й ДЕНЬ</text><text x="30" y="214" font-family="'Courier New', Courier, monospace" font-size="13" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">ЗАЩИТНЫЕ И ОЧИЩАЮЩИЕ ДЕЙСТВИЯ (перечень, без привязки ко времени)</text><text x="46" y="238" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">- мытьё дома после выноса гроба</text><text x="46" y="257" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">- переворачивание предметов</text><text x="46" y="276" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">- занавешивание зеркал</text><text x="46" y="295" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">- мытьё рук по возвращении с кладбища</text><text x="30" y="336" font-family="'Courier New', Courier, monospace" font-size="13" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">ЗАПРЕТЫ (перечень, без привязки ко времени)</text><text x="46" y="360" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">- близкие родственники не делают гроб</text><text x="46" y="379" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">- с кладбища не приносят еду</text><line x1="30" y1="416" x2="970" y2="416" stroke="#111111" stroke-width="0.8"/><text x="30" y="436" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ИСТОЧНИК: СТАТЬЯ О ПОХОРОНАХ В БРЭ (АВТОР НЕ НАЗВАН); ОБЩИЙ ОБЗОР, НЕ МЕСТНАЯ ЗАПИСЬ</text></svg>
