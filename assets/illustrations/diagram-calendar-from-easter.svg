<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><rect width="1000" height="460" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="440" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">DAYS COUNTED FROM EASTER</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Schematic axis. Day numbers as given on the plate: Radonitsa 9 (Church), Semik 45, Trinity Saturday 48</text><line x1="70" y1="230" x2="930" y2="230" stroke="#111111" stroke-width="2"/><line x1="70.0" y1="224" x2="70.0" y2="236" stroke="#111111"/><text x="70.0" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">0</text><line x1="190.39999999999998" y1="224" x2="190.39999999999998" y2="236" stroke="#111111"/><text x="190.39999999999998" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">7</text><line x1="310.79999999999995" y1="224" x2="310.79999999999995" y2="236" stroke="#111111"/><text x="310.79999999999995" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">14</text><line x1="431.2" y1="224" x2="431.2" y2="236" stroke="#111111"/><text x="431.2" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">21</text><line x1="551.5999999999999" y1="224" x2="551.5999999999999" y2="236" stroke="#111111"/><text x="551.5999999999999" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">28</text><line x1="672.0" y1="224" x2="672.0" y2="236" stroke="#111111"/><text x="672.0" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">35</text><line x1="792.4" y1="224" x2="792.4" y2="236" stroke="#111111"/><text x="792.4" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">42</text><line x1="912.8" y1="224" x2="912.8" y2="236" stroke="#111111"/><text x="912.8" y="254" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b665c" text-anchor="middle" font-weight="normal" font-style="normal">49</text><circle cx="70.0" cy="230" r="8" fill="#B00000"/><line x1="70.0" y1="221" x2="70.0" y2="170" stroke="#B00000"/><text x="76.0" y="132" font-family="'Courier New', Courier, monospace" font-size="15" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EASTER</text><text x="76.0" y="150" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">day 0</text><circle cx="224.79999999999998" cy="230" r="8" fill="#B00000"/><line x1="224.79999999999998" y1="221" x2="224.79999999999998" y2="170" stroke="#B00000"/><text x="230.79999999999998" y="132" font-family="'Courier New', Courier, monospace" font-size="15" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">RADONITSA</text><text x="230.79999999999998" y="150" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">day 9 (Tuesday of Thomas week, Church)</text><text x="230.79999999999998" y="166" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">1913 reference: mostly the Monday, some places Tuesday</text><circle cx="844.0" cy="230" r="8" fill="#B00000"/><line x1="844.0" y1="221" x2="844.0" y2="170" stroke="#B00000"/><text x="838.0" y="132" font-family="'Courier New', Courier, monospace" font-size="15" fill="#B00000" text-anchor="end" font-weight="bold" font-style="normal">SEMIK</text><text x="838.0" y="150" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="end" font-weight="normal" font-style="normal">day 45 (Thursday, seventh week)</text><text x="838.0" y="166" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="end" font-weight="normal" font-style="normal">a folk day; not in the Church calendar</text><circle cx="895.5999999999999" cy="230" r="8" fill="#B00000"/><line x1="895.5999999999999" y1="239" x2="895.5999999999999" y2="288" stroke="#B00000"/><text x="901.5999999999999" y="306" font-family="'Courier New', Courier, monospace" font-size="15" fill="#B00000" text-anchor="end" font-weight="bold" font-style="normal">TRINITY SAT.</text><text x="901.5999999999999" y="324" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="end" font-weight="normal" font-style="normal">day 48 (Church)</text><text x="30" y="372" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">RED = day named in the sources</text><text x="30" y="389" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">The day numbers are this plate's arithmetic, not a statement in the sources.</text><text x="30" y="406" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">No date of any year is given: Easter moves.</text><line x1="30" y1="416" x2="970" y2="416" stroke="#111111" stroke-width="0.8"/><text x="30" y="436" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  SOURCES: AZBYKA 2024, BOGOSLOV 1913, MALTSEV 2020, BRE (SEMIK)</text></svg>
