ill="#111111" text-anchor="start" font-weight="bold" font-style="normal">6</text><text x="840" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ПРОЩАНИЕ, КОТОРОЕ</text><text x="840" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">НЕ ХОЧЕТ БЫТЬ</text><text x="840" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ОКОНЧАТЕЛЬНЫМ</text><path d="M172 164.5 L188 164.5" stroke="#111111" stroke-width="2"/><path d="M182 159.5 L188 164.5 L182 169.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M332 164.5 L348 164.5" stroke="#111111" stroke-width="2"/><path d="M342 159.5 L348 164.5 L342 169.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M492 164.5 L508 164.5" stroke="#111111" stroke-width="2"/><path d="M502 159.5 L508 164.5 L502 169.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M652 164.5 L668 164.5" stroke="#111111" stroke-width="2"/><path d="M662 159.5 L668 164.5 L662 169.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M812 164.5 L828 164.5" stroke="#111111" stroke-width="2"/><path d="M822 159.5 L828 164.5 L822 169.5" fill="none" stroke="#111111" stroke-width="2"/><path d="M900.0 217 L900.0 253 L100.0 253 L100.0 221" fill="none" stroke="#B00000" stroke-width="1.6" stroke-dasharray="6 4"/><text x="500" y="273" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">Возврат к любой станции</text><rect x="30" y="295" width="940" height="66" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="325" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">Ни одно причитание здесь не приводится: цитата потребовала бы сверки с печатным источником и проверяемого перевода, чего это издание не</text><text x="40" y="340" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">делало.</text><line x1="30" y1="379" x2="970" y2="379" stroke="#111111" stroke-width="0.8"/><text x="30" y="399" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">РЕДАКЦИОННАЯ ДИАГРАММА  /  ОРИГИНАЛ  /  ПО БАРСОВУ 1872–1886 В ОПИСАНИИ ПЛИТЫ G</text></svg>
