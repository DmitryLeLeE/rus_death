<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 423" role="img"><rect width="1000" height="423" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="403" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">ДВИЖЕНИЕ ПРИЧИТАНИЯ ПО ОПИСАНИЮ САМОЙ ПЛИТЫ</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Шесть станций, названных на плите G. Порядок не закреплён: исполнительница может вернуться к любой станции. Структура, а не текст.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">РЕКОНСТРУКЦИЯ</text><rect x="30" y="116" width="140" height="82" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">1</text><text x="40" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ОБРАЩЕНИЕ К</text><text x="40" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">УМЕРШЕМУ</text><rect x="190" y="116" width="140" height="67" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="200" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">2</text><text x="200" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ВОПРОС О 