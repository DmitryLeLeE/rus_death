<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 438" role="img"><rect width="1000" height="438" fill="#E8E2D4"/><rect x="10" y="10" width="980" height="418" fill="none" stroke="#111111" stroke-width="1.5"/><text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">THE MOVEMENT OF A LAMENT, AFTER THE PLATE’S OWN DESCRIPTION</text><text x="30" y="66" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b665c" text-anchor="start" font-weight="normal" font-style="normal">Six stations named on plate G. The order is not fixed: the performer may return to any station. A structure, not a text.</text><text x="30" y="104" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#6b665c" text-anchor="start" font-weight="bold" font-style="normal">RECONSTRUCTION</text><rect x="30" y="116" width="140" height="82" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">1</text><text x="40" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">AN ADDRESS TO THE</text><text x="40" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">DEAD</text><rect x="190" y="116" width="140" height="82" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="200" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">2</text><text x="200" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A QUESTION ABOUT</text><text x="200" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">THE JOURNEY</text><rect x="350" y="116" width="140" height="112" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="360" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">3</text><text x="360" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A COMPLAINT</text><text x="360" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">AGAINST THE</text><text x="360" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">HOUSEHOLD’S NEW</text><text x="360" y="207" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">ORDER</text><rect x="510" y="116" width="140" height="82" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="520" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">4</text><text x="520" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">SELF-REPROACH BY</text><text x="520" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">THE SURVIVOR</text><rect x="670" y="116" width="140" height="82" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="680" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">5</text><text x="680" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A DESCRIPTION OF</text><text x="680" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">THE GRAVE</text><rect x="830" y="116" width="140" height="97" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="840" y="136" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#111111" text-anchor="start" font-weight="bold" font-style="normal">6</text><text x="840" y="162" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">A FAREWELL THAT</text><text x="840" y="177" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">REFUSES TO BE</text><text x="840" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">FINAL</text><path d="M172 172.0 L188 172.0" stroke="#111111" stroke-width="2"/><path d="M182 167.0 L188 172.0 L182 177.0" fill="none" stroke="#111111" stroke-width="2"/><path d="M332 172.0 L348 172.0" stroke="#111111" stroke-width="2"/><path d="M342 167.0 L348 172.0 L342 177.0" fill="none" stroke="#111111" stroke-width="2"/><path d="M492 172.0 L508 172.0" stroke="#111111" stroke-width="2"/><path d="M502 167.0 L508 172.0 L502 177.0" fill="none" stroke="#111111" stroke-width="2"/><path d="M652 172.0 L668 172.0" stroke="#111111" stroke-width="2"/><path d="M662 167.0 L668 172.0 L662 177.0" fill="none" stroke="#111111" stroke-width="2"/><path d="M812 172.0 L828 172.0" stroke="#111111" stroke-width="2"/><path d="M822 167.0 L828 172.0 L822 177.0" fill="none" stroke="#111111" stroke-width="2"/><path d="M900.0 232 L900.0 268 L100.0 268 L100.0 236" fill="none" stroke="#B00000" stroke-width="1.6" stroke-dasharray="6 4"/><text x="500" y="288" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="middle" font-weight="bold" font-style="normal">Return to any station</text><rect x="30" y="310" width="940" height="66" fill="#E8E2D4" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="40" y="340" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">No lament is printed here: quoting one would need collation against a printed source and a checkable translation, which this edition has</text><text x="40" y="355" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111111" text-anchor="start" font-weight="normal" font-style="normal">not done.</text><line x1="30" y1="394" x2="970" y2="394" stroke="#111111" stroke-width="0.8"/><text x="30" y="414" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B00000" text-anchor="start" font-weight="bold" font-style="normal">EDITORIAL DIAGRAM  /  ORIGINAL  /  AFTER BARSOV 1872–1886 AS DESCRIBED ON PLATE G</text></svg>
