<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #0d0c0b; }
      .frame { stroke: #423d33; stroke-width: 1.5; fill: none; }
      .inner-frame { stroke: #2a2620; stroke-width: 0.8; fill: none; }
      .title { font-family: 'Anton', 'Cinzel', serif; font-size: 26px; fill: #e8e4dc; letter-spacing: 0.12em; }
      .sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: #9c9588; font-style: italic; letter-spacing: 0.05em; }
      .latin { font-family: 'Inter', sans-serif; font-size: 11px; fill: #b13227; font-weight: bold; letter-spacing: 0.15em; }
      .plate-no { font-family: 'Anton', monospace; font-size: 14px; fill: #b13227; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg" />
  
  <!-- Outer & Inner Archival Frames -->
  <rect x="25" y="25" width="850" height="550" class="frame" />
  <rect x="33" y="33" width="834" height="534" class="inner-frame" />
  
  <!-- Header Block -->
  <g transform="translate(60, 68)">
    <text x="0" y="0" class="latin">PICEA ABIES (L.) H. KARST.</text>
    <text x="0" y="28" class="title">ЕЛОВЫЙ ЛАПНИКЪ</text>
    <text x="0" y="48" class="sub">Пограничный барьер и устилание пути гроба</text>
  </g>
  <text x="840" y="70" class="plate-no" text-anchor="end">HERBARIUM CHTHONICUM</text>

  <!-- Botanical Artwork -->
  
        <!-- Central stylized spruce branch -->
        <g stroke="#e2ded4" stroke-width="2.5" fill="none" stroke-linecap="round">
          <!-- Main stem -->
          <path d="M 450 540 C 450 380, 440 220, 450 90" />
          <!-- Sub branches left -->
          <path d="M 450 480 C 370 470, 310 430, 240 460" />
          <path d="M 448 410 C 350 390, 290 350, 210 370" />
          <path d="M 447 340 C 360 320, 310 270, 230 280" />
          <path d="M 448 260 C 370 240, 320 190, 260 190" />
          <path d="M 450 180 C 390 160, 340 120, 300 110" />
          <!-- Sub branches right -->
          <path d="M 450 480 C 530 470, 590 430, 660 460" />
          <path d="M 448 410 C 550 390, 610 350, 690 370" />
          <path d="M 447 340 C 540 320, 590 270, 670 280" />
          <path d="M 448 260 C 530 240, 580 190, 640 190" />
          <path d="M 450 180 C 510 160, 560 120, 600 110" />
        </g>
        <!-- Needles shading -->
        <g stroke="#9c9588" stroke-width="1.2" stroke-linecap="round">
          <!-- Needles cluster -->
          <path d="M 235 455 l -15 -10 m 15 10 l -10 15 m -20 -10 l 15 5 m -10 -20 l 8 18 M 270 445 l -12 -15 m 12 15 l 5 -18" />
          <path d="M 665 455 l 15 -10 m -15 10 l 10 15 m 20 -10 l -15 5 m 10 -20 l -8 18 M 630 445 l 12 -15 m -12 15 l -5 -18" />
          <path d="M 205 365 l -18 -8 m 18 8 l -8 18 m 10 -15 l -15 -10 m 20 2 l -12 16 M 245 360 l -14 -12 m 14 12 l 2 -18" />
          <path d="M 695 365 l 18 -8 m -18 8 l 8 18 m -10 -15 l 15 -10 m -20 2 l 12 16 M 655 360 l 14 -12 m -14 12 l -2 -18" />
          <path d="M 225 275 l -15 -10 m 15 10 l -10 15 m -8 -18 l 14 12 M 275 285 l -12 -15" />
          <path d="M 675 275 l 15 -10 m -15 10 l 10 15 m 8 -18 l -14 12 M 625 285 l 12 -15" />
          <!-- Pendant cone -->
          <path d="M 445 280 C 430 330, 430 390, 445 420 C 460 390, 460 330, 445 280 Z" fill="#2a2520" stroke="#b13227" stroke-width="1.8" />
          <path d="M 435 320 Q 445 330 455 320 M 432 350 Q 445 360 458 350 M 435 380 Q 445 390 455 380" stroke="#b13227" stroke-width="1.2" fill="none" />
        </g>
        

  <!-- Callouts -->
  <g class="callout">
          <circle cx="160" cy="215" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="160" y="220" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">1</text>
          <text x="180" y="220" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Колючая хвоя (не даёт душе вернуться)</text>
        </g>
<g class="callout">
          <circle cx="600" cy="275" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="600" y="280" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">2</text>
          <text x="620" y="280" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Смоляной бальзамический покров</text>
        </g>
<g class="callout">
          <circle cx="220" cy="505" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="220" y="510" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">3</text>
          <text x="240" y="510" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">Погребальная соломка и лапник</text>
        </g>
<g class="callout">
          <circle cx="540" cy="465" r="12" fill="#1b1815" stroke="#b13227" stroke-width="1.5" />
          <text x="540" y="470" font-family="'Anton', sans-serif" font-size="12" fill="#b13227" text-anchor="middle">4</text>
          <text x="560" y="470" font-family="'Inter', sans-serif" font-size="12" fill="#e2ded4" letter-spacing="0.02em">«Угодить под ель» (народный эвфемизм смерти)</text>
        </g>

  <!-- Footer metadata -->
  <g transform="translate(60, 555)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#7a756b" letter-spacing="0.08em">RUSSIAN CHTHONIC ATLAS · SECTION BOTANICA</text>
    <text x="780" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#7a756b" text-anchor="end">ARCHIVAL RECONSTRUCTION · CC BY-SA 4.0</text>
  </g>
</svg>